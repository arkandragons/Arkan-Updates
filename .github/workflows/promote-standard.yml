name: Promote canonical Launcher edition

on:
  workflow_dispatch:
    inputs:
      promotion_id:
        description: Opaque backend promotion ID
        required: true
        type: string
      mode:
        description: validate or publish
        required: true
        type: choice
        options: [validate, publish]
      descriptor_key:
        description: Private R2 descriptor key
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: arkan-canonical-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.ARKAN_PROMOTION_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.ARKAN_PROMOTION_R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ACCOUNT_ID: ${{ secrets.ARKAN_PROMOTION_R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.ARKAN_PROMOTION_R2_BUCKET }}
      CALLBACK_SECRET: ${{ secrets.ARKAN_PUBLISHER_CALLBACK_SECRET }}
      CALLBACK_URL: ${{ secrets.ARKAN_PUBLISHER_CALLBACK_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/publisher
            manifest-*.json
          sparse-checkout-cone-mode: false

      - name: Download private descriptor
        id: descriptor
        run: |
          aws s3 cp "s3://$R2_BUCKET/${{ inputs.descriptor_key }}" promotion.json --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          python .github/publisher/prepare_inputs.py promotion.json >> "$GITHUB_OUTPUT"

      - name: Download staged artifacts
        run: |
          aws s3 cp "s3://$R2_BUCKET/${{ steps.descriptor.outputs.archive_key }}" instance.zip --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          aws s3 cp "s3://$R2_BUCKET/${{ steps.descriptor.outputs.inventory_key }}" inventory.json --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"

      - name: Validate package and build immutable manifest
        run: |
          python .github/publisher/validate_standard.py \
            --descriptor promotion.json \
            --archive instance.zip \
            --inventory inventory.json \
            --repository "$GITHUB_REPOSITORY" \
            --mode "${{ inputs.mode }}" \
            --current-manifest "${{ steps.descriptor.outputs.manifest_filename }}" \
            --output generated-manifest.json

      - name: Publish immutable release assets
        if: inputs.mode == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REVISION="${{ steps.descriptor.outputs.revision }}"
          EDITION="${{ steps.descriptor.outputs.edition_id }}"
          gh release create "$EDITION-$REVISION" instance.zip inventory.json generated-manifest.json \
            --title "Arkan $EDITION $REVISION" \
            --notes "Publicação canônica validada. Promotion: ${{ inputs.promotion_id }}"

      - name: Move edition pointer last
        if: inputs.mode == 'publish'
        run: |
          MANIFEST="${{ steps.descriptor.outputs.manifest_filename }}"
          cp generated-manifest.json "$MANIFEST"
          git config user.name "Arkan Canonical Publisher"
          git config user.email "publisher@arkandragons.com"
          git add "$MANIFEST"
          git commit -m "release: promote ${{ steps.descriptor.outputs.edition_id }} ${{ steps.descriptor.outputs.revision }}"
          git push origin HEAD:main
          python .github/publisher/verify_public_manifest.py "$MANIFEST"

      - name: Report validation success
        id: callback_validation
        if: success() && inputs.mode == 'validate'
        run: |
          python .github/publisher/callback.py \
            --url "$CALLBACK_URL" --secret "$CALLBACK_SECRET" \
            --promotion "${{ inputs.promotion_id }}" --state ready \
            --run-id "$GITHUB_RUN_ID"

      - name: Report publication success
        id: callback_publication
        if: success() && inputs.mode == 'publish'
        run: |
          python .github/publisher/callback.py \
            --url "$CALLBACK_URL" --secret "$CALLBACK_SECRET" \
            --promotion "${{ inputs.promotion_id }}" --state published \
            --run-id "$GITHUB_RUN_ID" --manifest generated-manifest.json

      - name: Report failure
        if: failure() && steps.callback_validation.outcome != 'failure' && steps.callback_publication.outcome != 'failure'
        run: |
          python .github/publisher/callback.py \
            --url "$CALLBACK_URL" --secret "$CALLBACK_SECRET" \
            --promotion "${{ inputs.promotion_id }}" --state ${{ inputs.mode == 'validate' && 'rejected' || 'failed' }} \
            --run-id "$GITHUB_RUN_ID" --failure "GitHub Actions recusou ou não concluiu a promoção."
